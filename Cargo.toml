[package]
name = "magpie-bird"
version = "0.7.0"
authors = ["DanielMorton <dacmorton@gmail.com>"]
description = "eBird Target Bird Scraper"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DanielMorton/magpie"
edition = "2021"
exclude = [
    ".idea/*",
    "magpie.iml"
]

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
csv = "1.4.0"
rayon = "1.12.0"
rpassword = "7.5.4"
scraper = "0.27.0"
strum_macros = "0.28.0"
thiserror = "2.0.19"
regex = "1.13.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dependencies.indicatif]
version = "0.18.6"
features = ["rayon"]

[dependencies.reqwest]
version = "0.13.4"
features = ["blocking", "cookies", "query", "form"]