[package]
name = "magpie-bird"
version = "0.5.1"
authors = ["DanielMorton <dacmorton@gmail.com>"]
description = "eBird Target Bird Scraper"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DanielMorton/magpie"
edition = "2021"
exclude = [
    ".idea/*",
    "magpie.iml"
]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
itertools = "0.15.0"
lazy_static = "1.5.0"
rayon = "1.12.0"
rpassword = "7.5.4"
scraper = "0.27.0"
strum = "0.28.0"
strum_macros = "0.28.0"
thiserror = "2.0.18"

[dependencies.indicatif]
version = "0.18.6"
features = ["rayon"]

[dependencies.polars]
version = "0.54.4"
features = ["diagonal_concat", "lazy"]

[dependencies.reqwest]
version = "0.13.4"
features = ["blocking", "cookies", "query", "form"]
